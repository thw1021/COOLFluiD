#==================================================================
# Configuration options for the prepare.pl script
#==================================================================
# This file should be in the directory from where the script is run
#==================================================================
# COOLFluiD build configuration for:
#   Ubuntu 22.04 | CUDA 12.2 | Boost 1.85 | MPICH | PETSc 3.24 | Mutation++ | RTX 3050 (sm_86)
#==================================================================

#==================================================================
# default build options
#==================================================================

coolfluid_dir    = /home/tang/packages/COOLFluiD
basebuild_dir    = /home/tang/packages/COOLFluiD/build
install_dir      = /home/tang/packages/COOLFluiD/install

# compilers
cc               = /usr/bin/gcc
cxx              = /usr/bin/g++
fc               = gfortran

# CUDA configuration
cudac            = /usr/local/cuda-12.2/bin/nvcc
cuda_dir         = /usr/local/cuda-12.2
cudacflags       = --std c++17 -arch sm_86
withcuda         = 1

nofortran        = 0
withcurl         = 0

# library locations
mpi_dir          = /home/tang/packages/mpichInstall
boost_dir        = /home/tang/packages/boost_1_85_0/install
petsc_dir        = /home/tang/packages/petsc
parmetis_dir     = /home/tang/packages/mpichInstall

# Mutation++ configuration (thermal nonequilibrium)
mutationpp_dir   = /home/tang/packages/Mutationpp/install
with_mutationpp  = 1

allactive        = 1
with_testcases   = 1
cmake_generator  = make

# C++17 standard (required by Boost 1.85 atomic headers)
optim_cxxflags   = -O3 -g -fPIC -std=c++17
optim_cflags     = -O3 -g -fPIC
optim_fflags     = -O3 -g -fPIC
